require conf/machine/imx943-19x19-lpddr4-evk.conf

# Include device trees for other boards for internal test
KERNEL_DEVICETREE += " \
	freescale/imx943-evk-evse.dtb \
	freescale/imx943-evk-evse-dual-gun.dtb \
"

KERNEL_DEVICETREE_BASENAME = "imx943-evk"

BBMASK += "openssl_3.2.%.bbappend"
ERROR_QA:remove:layer-meta-everest = "patch-status"
