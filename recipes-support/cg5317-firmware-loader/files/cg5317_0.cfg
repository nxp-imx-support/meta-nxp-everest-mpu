# Lumissil CG5317 host_loading_service parameters.
# Read by cg5317-firmware-load.service via EnvironmentFile=.
# Shell syntax: VAR=value, no spaces around =, no quotes needed
# unless the value contains whitespace.
#
# After editing, restart the service:
#   systemctl daemon-reload     # if service file itself changed
#   systemctl restart cg5317-firmware-load.service

# Firmware binary (chip-side image)
FW_PATH=/home/root/res/cg5317/binaries/CG5317-04.05.000.0020-DEFAULT.bin

# Per-board configuration blob (EVSE-specific, includes MAC/HFID/etc.)
CFG_PATH=/home/root/res/cg5317/binaries/eth_evse_config.bin

# Host-side Ethernet interface that talks raw L2 to the CG5317 modem.
# Must match what `ip link show` reports on this hardware.
ETH_IFNAME=eth0

# Modem reset GPIO. Toggled by the loader to put the chip into
# load-firmware mode before transferring the image.
CG_RESET_GPIO_CHIP=gpiochip0
CG_RESET_GPIO_OFFSET=18

# 0 = SPI transport, 1 = Ethernet transport. We use Ethernet on
# i.MX93 EVK.
IFACE_MODE=1

# Set to "-r" to enable RMII mode on the CG5317. Leave empty for
# the default GMII/MII configuration.
RMII_FLAG=
