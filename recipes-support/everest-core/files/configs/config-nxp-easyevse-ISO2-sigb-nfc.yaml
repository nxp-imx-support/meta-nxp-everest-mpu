      uk_smartcharging_random_delay_at_any_change: false
      uk_smartcharging_random_delay_enable: false
      uk_smartcharging_random_delay_max_duration: 600
      zero_power_allow_ev_to_ignore_pause: false
      zero_power_ignore_pause: false
    connections:
      ac_rcd:
        - implementation_id: rcd
          module_id: SigboardNXP0
      bsp:
        - implementation_id: board_support
          module_id: SigboardNXP0
      hlc:
        - implementation_id: charger
          module_id: EvseV2G0
      powermeter_car_side:
        - implementation_id: powermeter
          module_id: SigboardNXP0
      slac:
        - implementation_id: main
          module_id: EvseSlac0
    module: EvseManager
  EvseSecurity0:
    config_module:
      csms_ca_bundle: iso2/ca/csms/CSMS_ROOT_CA.pem
      csms_leaf_cert_directory: iso2/client/csms
      csms_leaf_key_directory: iso2/client/csms
      mf_ca_bundle: iso2/ca/mf/MF_ROOT_CA.pem
      mo_ca_bundle: iso2/ca/mo/MO_ROOT_CA.pem
      private_key_password: '123456'
      secc_leaf_cert_directory: iso2/client/cso
      secc_leaf_key_directory: iso2/client/cso
      v2g_ca_bundle: iso2/ca/v2g/V2G_ROOT_CA.pem
    connections: {}
    module: EvseSecurity
  EvseSlac0:
    config_implementation:
      main:
        ac_mode_five_percent: true
        chip_reset_delay_ms: 100
        chip_reset_timeout_ms: 500
        debug_simulate_failed_matching: false
        device: eth0
        do_chip_reset: false
        link_status_detection: false
        link_status_retry_ms: 100
        link_status_timeout_ms: 10000
        number_of_sounds: 10
        publish_mac_on_first_parm_req: false
        publish_mac_on_match_cnf: true
        reset_instead_of_fail: true
        set_key_timeout_ms: 500
        sounding_attenuation_adjustment: 0
    connections: {}
    module: EvseSlac
  EvseV2G0:
    config_module:
      auth_timeout_eim: 300
      auth_timeout_pnc: 55
      device: eth0
      enable_sdp_server: true
      supported_DIN70121: false
      supported_ISO15118_2: true
      terminate_connection_on_failed_response: false
      tls_key_logging: false
      tls_key_logging_path: /tmp
      tls_security: prohibit
      tls_timeout: 15000
      verify_contract_cert_chain: false
    connections:
      security:
        - implementation_id: main
          module_id: EvseSecurity0
    module: EvseV2G
  SigboardNXP0:
    config_module:
      baud_rate: 115200
      meter_present: true
      caps_max_current_A: 32
      caps_min_current_A: 0
      debug: false
      serial_port: /dev/ttyLP2
    connections: {}
    module: SigboardNXP
  auth:
    config_module:
      connection_timeout: 60
      ignore_connector_faults: false
      master_pass_group_id: ''
      prioritize_authorization_over_stopping_transaction: true
      selection_algorithm: PlugEvents
    connections:
      evse_manager:
        - implementation_id: evse
          module_id: EvseManager0
      token_provider:
        - implementation_id: main
          module_id: PN7160TokenProvider0
      token_validator:
        - implementation_id: main
          module_id: token_validator
    module: Auth
  energy_manager:
    config_module:
      debug: false
      nominal_ac_voltage: 230
      schedule_interval_duration: 60
      schedule_total_duration: 1
      slice_ampere: 0.5
      slice_watt: 500
      switch_3ph1ph_max_nr_of_switches_per_session: 0
      switch_3ph1ph_power_hysteresis_W: 200
      switch_3ph1ph_switch_limit_stickyness: DontChange
      switch_3ph1ph_time_hysteresis_s: 600
      switch_3ph1ph_while_charging_mode: Never
      update_interval: 1
    connections:
      energy_trunk:
        - implementation_id: energy_grid
          module_id: grid_connection_point
    module: EnergyManager
  grid_connection_point:
    config_module:
      fuse_limit_A: 32
      phase_count: 1
    connections:
      energy_consumer:
        - implementation_id: energy_grid
          module_id: EvseManager0
    module: EnergyNode
  token_validator:
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
    connections: {}
    module: DummyTokenValidator
  PN7160TokenProvider0:
    config_implementation:
      main:
        debug: false
        disable_nfc_rfid: false
        token_debounce_interval_ms: 3000
    connections: {}
    module: PN7160TokenProvider